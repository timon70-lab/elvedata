name: Fangst-pipeline (Inatur laksebørs)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 * * * *'   # Hver time, 30 min over (unngår å kollidere med NVE-cachen på hel time)

permissions:
  contents: write

jobs:
  hent-fangster:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer avhengigheter
        run: pip install requests

      - name: Kjør fangst-pipeline
        run: python scripts/fangst_pipeline.py

      - name: Commit og push resultat
        run: |
          git config user.name "fangst-pipeline"
          git config user.email "actions@users.noreply.github.com"
          # Glob i stedet for eksplisitt liste: tar med alle elver i RIVERS (også nye),
          # og feiler ikke hvis en elv aldri har fått skrevet fil.
          git add data/fangster_*.json
          if git diff --cached --quiet; then
            echo "Ingen endringer aa committe."
            exit 0
          fi
          git commit -m "Fangst-data oppdatert $(date -u '+%Y-%m-%d %H:%M UTC')"
          for forsok in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (forsok $forsok)."
              exit 0
            fi
            echo "Push avvist (forsok $forsok) - henter og rebaser..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          echo "Push feilet etter 5 forsok."
          exit 1
