name: NVE - hent døgnvannføring 2016-2025

# Kjøres manuelt, og normalt bare én gang. Henter timesverdier fra NVE og
# aggregerer dem til 06-06-døgn, samme vindu som nedbørfilene fra Frost.
# Timesverdiene lagres ikke - bare døgnverdiene.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hent-vannforing:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Hent og aggreger vannføring
        env:
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
        run: |
          python3 scripts/nve_hent_dogn.py

      - name: Commit datafilene
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logg/vannforing_dogn_*.csv
          git diff --staged --quiet || git commit -m "NVE: døgnvannføring 2016-2025 (06-06 UTC)"
          git push
