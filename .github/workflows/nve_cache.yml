name: Oppdater NVE vannføringsdata

on:
  schedule:
    - cron: '0 * * * *'   # Kjører hver time på timen
  workflow_dispatch:        # Kan også kjøres manuelt fra GitHub

jobs:
  hent-nve-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # Nødvendig for å pushe JSON-filene

    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Hent data fra NVE HydAPI
        env:
          NVE_API_KEY: ${{ secrets.NVE_API_KEY }}
        run: |
          mkdir -p data
          curl -s \
            -H "X-API-Key: $NVE_API_KEY" \
            "https://hydapi.nve.no/api/v1/Observations?StationId=23.8.0&Parameter=1001&ResolutionTime=60&ReferenceTime=P7D/" \
            -o data/vannforing.json
          curl -s \
            -H "X-API-Key: $NVE_API_KEY" \
            "https://hydapi.nve.no/api/v1/Observations?StationId=24.9.0&Parameter=1001&ResolutionTime=60&ReferenceTime=P7D/" \
            -o data/vannforing_lygna.json
          curl -s \
            -H "X-API-Key: $NVE_API_KEY" \
            "https://hydapi.nve.no/api/v1/Observations?StationId=22.4.0&Parameter=1001&ResolutionTime=60&ReferenceTime=P7D/" \
            -o data/vannforing_mandalselva.json
          curl -s \
            -H "X-API-Key: $NVE_API_KEY" \
            "https://hydapi.nve.no/api/v1/Observations?StationId=21.11.0&Parameter=1001&ResolutionTime=60&ReferenceTime=P7D/" \
            -o data/vannforing_otra.json
          curl -s \
            -H "X-API-Key: $NVE_API_KEY" \
            "https://hydapi.nve.no/api/v1/Observations?StationId=22.22.0&Parameter=1001&ResolutionTime=60&ReferenceTime=P7D/" \
            -o data/vannforing_sygna.json
          curl -s \
            -H "X-API-Key: $NVE_API_KEY" \
            "https://hydapi.nve.no/api/v1/Observations?StationId=20.3.0&Parameter=1001&ResolutionTime=60&ReferenceTime=P7D/" \
            -o data/vannforing_tovdalselva.json
          python3 -c "
          import json
          for fn, navn in [('data/vannforing.json','Audna/Gaupefossen'), ('data/vannforing_lygna.json','Lygna/Tingvatn'), ('data/vannforing_mandalselva.json','Mandalselva/Kjølemo'), ('data/vannforing_otra.json','Otra/Heisel'), ('data/vannforing_sygna.json','Sygna/Søgne'), ('data/vannforing_tovdalselva.json','Tovdalselva/Flakksvann')]:
              with open(fn) as f:
                  d = json.load(f)
              obs = d['data'][0]['observations']
              print(f'{navn} OK: {len(obs)} observasjoner')
          "

      - name: Hent nedbørsprognose fra MET
        run: |
          curl -s \
            -H "User-Agent: audna-dashboard github.com/timon70-lab/audna" \
            "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=58.27&lon=7.40" \
            -o data/nedbor.json
          curl -s \
            -H "User-Agent: audna-dashboard github.com/timon70-lab/audna" \
            "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=58.4786&lon=7.2083" \
            -o data/nedbor_lygna.json
          curl -s \
            -H "User-Agent: audna-dashboard github.com/timon70-lab/audna" \
            "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=58.155136&lon=7.835791" \
            -o data/nedbor_sygna.json
          curl -s \
            -H "User-Agent: audna-dashboard github.com/timon70-lab/audna" \
            "https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=58.6020&lon=8.4181" \
            -o data/nedbor_tovdalselva.json
          python3 -c "
          import json
          for fn, navn in [('data/nedbor.json','Audna/Konsmo-punkt'), ('data/nedbor_lygna.json','Lygna/Eiken-punkt'), ('data/nedbor_sygna.json','Sygna/Nodeland-punkt'), ('data/nedbor_tovdalselva.json','Tovdalselva/Hynnekleiv-punkt')]:
              with open(fn) as f:
                  d = json.load(f)
              ts = d['properties']['timeseries']
              print(f'MET OK ({navn}): {len(ts)} tidspunkter')
          "

      - name: Logg varslet nedbor mot vannforing
        run: |
          python3 scripts/logg_nedbor.py

      - name: Commit og push JSON-filene
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logg
          git add data/vannforing.json data/vannforing_lygna.json data/vannforing_mandalselva.json data/vannforing_otra.json data/vannforing_sygna.json data/vannforing_tovdalselva.json data/nedbor.json data/nedbor_lygna.json data/nedbor_sygna.json data/nedbor_tovdalselva.json
          if git diff --cached --quiet; then
            echo "Ingen endringer aa committe."
            exit 0
          fi
          git commit -m "Data oppdatert $(date -u '+%Y-%m-%d %H:%M UTC')"
          for forsok in 1 2 3 4 5; do
            if git push; then
              echo "Push OK (forsok $forsok)."
              exit 0
            fi
            echo "Push avvist (forsok $forsok) - henter og rebaser..."
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep 5
          done
          echo "Push feilet etter 5 forsok."
          exit 1
