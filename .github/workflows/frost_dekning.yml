name: Frost - mål datadekning

# Kjøres manuelt. Henter faktiske observasjoner for kandidatstasjonene og
# teller hvor komplette seriene er sesong for sesong 2016-2025. Svarer på
# det stasjonsoppslaget ikke kunne svare på: om dataene faktisk er der.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maal-dekning:
    runs-on: ubuntu-latest
    steps:
      - name: Sjekk ut repo
        uses: actions/checkout@v4

      - name: Mål datadekning i Frost
        env:
          # Secret heter MET_FROST_API i repoet; skriptet leser FROST_CLIENT_ID.
          FROST_CLIENT_ID: ${{ secrets.MET_FROST_API }}
          # Valgfri. Settes bare hvis Basic med tomt passord ikke godtas.
          FROST_CLIENT_SECRET: ${{ secrets.MET_FROST_SECRET }}
        run: |
          python3 scripts/frost_dekning.py

      - name: Commit rapporten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/logg/frost_dekning.md
          git diff --staged --quiet || git commit -m "Frost: rapport over datadekning"
          git push
